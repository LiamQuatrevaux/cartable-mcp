[project]
name = "ecoledirecte"
version = "0.5.1"
description = "Async Python client and MCP server for the Ecole Directe API."
license = "LGPL-3.0-or-later"
readme = "README.md"
authors = [
    { name = "Giga77" },  # client ecoledirecte_api (travail dérivé)
    { name = "LiamQuatrevaux" },  # couche MCP et adaptations
]
maintainers = [{ name = "LiamQuatrevaux" }]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Natural Language :: French",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "aiohttp>=3.9.0,<4.0",
    "backoff>=1.10.0,<3.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
http = ["uvicorn>=0.30,<1"]
fast = ["uvloop>=0.19; sys_platform != 'win32'"]
dev = [
    "mypy>=1.10",
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ecoledirecte-mcp = "ecoledirecte_mcp.server:main"
ecoledirecte-mcp-http = "ecoledirecte_mcp.http:main"

[tool.poetry]
packages = [
    { include = "ecoledirecte_api", from = "src" },
    { include = "ecoledirecte_mcp", from = "src" },
]

[tool.poetry.group.dev.dependencies]
mcp = ">=2.3,<3"
mypy = ">=1.10"
ruff = ">=0.6"
pytest = ">=8.0"
pytest-asyncio = ">=0.23"

[tool.mypy]
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "test_api_version",
    "test_client_behavior",
    "test_client_logging",
    "test_ecoledirecte_api",
    "test_cache",
    "test_codec",
    "test_endpoints",
    "test_mcp_server",
    "test_session",
    "test_security",
]
allow_untyped_defs = true
disallow_untyped_decorators = false
disable_error_code = "attr-defined, unreachable"

[[tool.mypy.overrides]]
module = ["ecoledirecte_mcp.*", "ecoledirecte_mcp"]
disallow_untyped_decorators = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
